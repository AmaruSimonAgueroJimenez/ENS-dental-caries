   <g id="text_1">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start" x="14.173228" y="22.677165" transform="rotate(-0 14.173228 22.677165)">a  Study cohort</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start" x="272.125984" y="22.677165" transform="rotate(-0 272.125984 22.677165)">b  Model development and evaluation</text>
   </g>
   <g id="text_3">
    <text style="font-size: 7.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(42.76111 54.80202)">ENS 2016–2017 release</text>
    <text style="font-size: 7.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(67.879664 63.43244)">n = 6,233</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(35.05486 136.307135)">Complete dental examination</text>
    <text style="font-size: 7.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(67.879664 145.637164)">n = 5,520</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(185.86478 89.647425)">No complete</text>
    <text style="font-size: 7px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(176.133139 98.842172)">dental examination</text>
    <text style="font-size: 7px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(193.737592 107.389418)">n = 713</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(42.151149 223.768397)">Primary modelling cohort</text>
    <text style="font-size: 7.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(50.271657 232.962489)">Dentate participants</text>
    <text style="font-size: 7.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(67.879664 242.338222)">n = 5,036</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(186.748334 180.899807)">Edentulous</text>
    <text style="font-size: 7.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(192.896577 190.059328)">n = 484</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(66.078391 308.53271)">Original-manuscript reference subset</text>
    <text style="font-size: 7.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(75.236008 317.904341)">n = 4,994; caries cases = 2,664</text>
    <text style="font-size: 7.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(76.489329 327.576557)">Observed education and water</text>
    <text style="font-size: 7.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(60.652024 335.946235)">42 others remain in the modelling cohort</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7.2px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(14.173228 391.317752)">Dashed connector: overlapping reference subset,</text>
    <text style="font-size: 7.2px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(14.173228 400.439744)">not a further modelling exclusion.</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(343.656598 54.10241)">Same 5,036 participants</text>
    <text style="font-size: 7.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(354.497613 63.915838)">13 model variants</text>
   </g>
   <g id="text_11">
    <text style="font-size: 7.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(334.900934 112.168701)">5 outer folds grouped by PSU</text>
    <text style="font-size: 7.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(340.320855 122.06416)">Hold out one fold at a time</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 7.7px; font-family: 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle" x="384.094488" y="166.402049" transform="rotate(-0 384.094488 166.402049)">Within each outer training set</text>
   </g>
   <g id="text_13">
    <text style="font-size: 7.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(335.109527 196.884967)">3 inner folds grouped by PSU</text>
    <text style="font-size: 7.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(329.694293 205.98941)">Fit imputation and preprocessing</text>
    <text style="font-size: 7.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(328.583941 215.139557)">Tune by survey-weighted log loss</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7.4px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(311.902863 275.195953)">Refit selected pipeline on outer training data</text>
    <text style="font-size: 7.4px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(313.751129 284.959473)">Predict the untouched outer evaluation fold</text>
   </g>
   <g id="text_15">
    <text style="font-size: 7.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(335.734723 330.480363)">5,036 out-of-fold probabilities</text>
    <text style="font-size: 7.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(335.738238 340.328361)">for each of 13 model variants</text>
   </g>
   <g id="text_16">
    <text style="font-size: 7.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(321.010113 386.806227)">Weighted performance: all 13 variants</text>
    <text style="font-size: 7.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(324.266168 395.91067)">Individual and grouped permutation:</text>
    <text style="font-size: 7.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(330.320074 405.10652)">random forest and spline logistic</text>
   </g>
  </g>
 </g>
